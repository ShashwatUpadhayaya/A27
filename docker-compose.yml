services:
  client:
    build:
      context: ./client
    container_name: a27-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: a27-server
    environment:
      MONGO_URI: mongodb://mongo:27017/college_crud_demo
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: a27-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
